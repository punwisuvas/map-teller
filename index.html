<title>10 จังหวัดเศรษฐกิจใหญ่ · 2567</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
.reel {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #05080d;
  color: #f4f7fb;
  overflow: hidden;
}

.reel-frame {
  container-type: size;
  position: relative;
  height: 100vh;
  height: 100dvh;
  aspect-ratio: 9 / 16;
  max-width: 100vw;
  overflow: hidden;
  background: #0b1a24;
}

@media (max-aspect-ratio: 0.57) {
  .reel-frame {
    width: 100vw;
    height: auto;
  }
}

.reel-map,
.reel-grain,
.reel-vig,
.reel-label,
.reel-src,
.reel-bar {
  position: absolute;
}

.reel-map {
  inset: 0;
}

.reel-grain,
.reel-vig {
  inset: 0;
  pointer-events: none;
}

.reel-grain {
  opacity: 0.16;
  mix-blend-mode: overlay;
  background-image: radial-gradient(rgba(255,255,255,.45) 0.55px, transparent 0.65px);
  background-size: 3px 3px;
}

.reel-vig {
  background: radial-gradient(ellipse at 50% 55%, transparent 52%, rgba(0, 0, 0, 0.58) 100%);
}

.reel-label {
  left: 5%;
  top: 8%;
  right: 8%;
  pointer-events: none;
  font-stretch: 75%;
}

.reel-kicker {
  display: inline-block;
  font-weight: 800;
  font-size: 2.8cqh;
  letter-spacing: 0.04em;
  background: #ffc83d;
  color: #1b1200;
  padding: 0.12em 0.55em;
  transform: skewX(-12deg);
}

.reel-title {
  display: inline-block;
  margin-top: 0.35em;
  font-weight: 900;
  font-size: 4.4cqh;
  line-height: 1.15;
  padding: 0.08em 0.35em;
  background: rgba(6, 10, 16, 0.55);
  border-left: 0.16em solid #ffc83d;
  text-shadow: 0 3px 14px rgba(0, 0, 0, 0.8);
}

.reel-title.is-big {
  font-size: 7.2cqh;
  color: #ffe14d;
  background: none;
  border: 0;
  padding: 0;
}

.reel-sub {
  display: block;
  margin-top: 0.45em;
  font-weight: 700;
  font-size: 2.5cqh;
  color: #ffe7a3;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
}

.reel-src {
  left: 5%;
  right: 5%;
  bottom: 7%;
  font-size: 1.7cqh;
  line-height: 1.45;
  font-weight: 600;
  color: #e8eef5;
  background: rgba(6, 10, 16, 0.72);
  border-left: 4px solid #ffc83d;
  padding: 0.7em 0.9em;
  opacity: 0;
  pointer-events: none;
}

.reel-src.is-on {
  opacity: 1;
}

.reel-chart {
  position: absolute;
  left: 4%;
  right: 4%;
  width: auto;
  top: auto;
  bottom: 11%;
  z-index: 2;
  padding: 0.7cqh 0.9cqh 0.45cqh;
  background: linear-gradient(180deg, rgba(6, 10, 16, 0.2), rgba(6, 10, 16, 0.78));
  border-left: 0.28cqh solid #ffc83d;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.45s ease;
}

.reel-chart.is-on {
  opacity: 1;
}

.reel-chart h2 {
  margin: 0 0 0.45cqh;
  font-size: 1.45cqh;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 2px 6px #000;
}

.reel-row {
  display: grid;
  grid-template-columns: 34% 1fr;
  align-items: center;
  gap: 0.45cqh;
  margin: 0.22cqh 0;
  font-size: 1.45cqh;
  font-weight: 700;
  color: #f4f7fb;
  white-space: nowrap;
  text-shadow: 0 1px 3px #000;
}

.reel-bw {
  display: flex;
  align-items: center;
  gap: 0.35cqh;
  min-width: 0;
}

.reel-bw i {
  display: block;
  height: 0.85cqh;
  width: 0;
  max-width: 78%;
  border-radius: 1cqh;
  background: linear-gradient(90deg, #c45a12, #ffe14d);
  transition: width 0.7s ease;
  flex: none;
}

.reel-bw em {
  font-style: normal;
  font-weight: 800;
  font-size: 1.05cqh;
}

.reel-status {
  position: absolute;
  left: 5%;
  top: 42%;
  z-index: 3;
  margin: 0;
  padding: 0.6em 0.8em;
  background: rgba(6, 10, 16, 0.78);
  border-left: 4px solid #ffc83d;
  font-weight: 700;
}

.prov-tag {
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.35s ease;
}

.prov-tag b {
  font: 900 12px "Noto Sans Thai", system-ui, sans-serif;
  background: #ffc83d;
  color: #1b1200;
  padding: 1px 7px;
  transform: skewX(-12deg);
}

.prov-tag span {
  margin-top: 2px;
  font: 800 13px "Noto Sans Thai", system-ui, sans-serif;
  color: #fff;
  background: rgba(6, 10, 16, 0.62);
  border-left: 3px solid #ffc83d;
  padding: 1px 6px;
  white-space: nowrap;
  text-shadow: 0 1px 3px #000;
}

.prov-tag::after {
  content: "";
  width: 1px;
  height: 16px;
  background: rgba(255, 255, 255, 0.9);
}

.reel-bar {
  left: 0;
  bottom: 0;
  height: 4px;
  width: 0;
  background: #2ee6ff;
}

.reel-menu {
  position: fixed;
  left: 12px;
  bottom: 12px;
  z-index: 30;
  font: 700 15px "Noto Sans Thai", system-ui, sans-serif;
  color: #fff;
  background: rgba(10, 16, 24, 0.82);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 10px;
  padding: 8px 12px;
  min-height: 44px;
}

.reel-ui {
  position: fixed;
  left: 12px;
  bottom: 64px;
  z-index: 30;
  display: none;
  flex-wrap: wrap;
  gap: 8px;
  max-width: calc(100vw - 24px);
}

.reel-ui.is-open {
  display: flex;
}

.reel-ui button,
.reel-ui a {
  font: 600 13px "Noto Sans Thai", system-ui, sans-serif;
  color: #fff;
  background: rgba(10, 16, 24, 0.82);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 10px;
  padding: 8px 12px;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  text-decoration: none;
}

.reel-ui button.is-on {
  background: #2ee6ff;
  color: #00222a;
}

body.is-rec .reel-menu,
body.is-rec .reel-ui,
body.is-rec .reel-bar {
  display: none;
}


.maplibregl-ctrl-attrib { font-size: 9px !important; opacity: 0.55; }
button { font-family: inherit; }
</style>

  row.innerHTML = '<span>' + pin.rank + " " + pin.short + '</span><div class="reel-bw"><i></i><em>' + (GPP[pin.rank] / 1e6).toFixed(2) + "</em></div>";
  rows.appendChild(row);
}
const bars = [...rows.querySelectorAll("i")];
const el = {
  kicker: document.getElementById("kicker"),
  title: document.getElementById("title"),
  sub: document.getElementById("sub"),
  label: document.getElementById("label"),
  chart: document.getElementById("chart"),
  src: document.getElementById("src"),
  bar: document.getElementById("bar"),
  status: document.getElementById("status"),
  menu: document.getElementById("menu"),
  play: document.getElementById("playBtn")
};
let labelsOn = true;
let paused = false;
let focus = -1;
const clock = { t0: 0, elapsed: 0 };
const q = new URLSearchParams(location.search).get("t");
if (q !== null && Number.isFinite(Number(q))) {
  clock.elapsed = Math.min(DURATION, Math.max(0, Number(q)));
  paused = true;
}
for (const feature of GEO.features) {
  const rank = feature.properties.rank;
  feature.properties.gpp = GPP[rank] || 0;
}
const scale = ["+", 0.16, ["*", 0.84, ["/", ["get", "gpp"], BKK]]];
const map = new maplibregl.Map({
  container: "map",
  maxPitch: 85,
  attributionControl: { compact: true },
  fadeDuration: 0,
  center: FRAMES[0].c,
  zoom: FRAMES[0].z,
  pitch: FRAMES[0].p,
  bearing: FRAMES[0].b,
  style: {
    version: 8,
    sources: {
      sat: {
        type: "raster",
        tileSize: 256,
        maxzoom: 19,
        tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
        attribution: "ภาพ © Esri, Maxar · ขอบเขตจังหวัด"
      },
      prov: { type: "geojson", data: GEO }
    },
    layers: [
      { id: "bg", type: "background", paint: { "background-color": "#163a2c" } },
      { id: "sat", type: "raster", source: "sat", paint: { "raster-saturation": 0.42, "raster-contrast": 0.2, "raster-brightness-min": 0.05, "raster-hue-rotate": -8 } },
      { id: "line", type: "line", source: "prov", paint: { "line-color": "#ffffff", "line-width": 0.8, "line-opacity": 0.55 } },
      { id: "rise", type: "fill-extrusion", source: "prov", filter: [">", ["get", "rank"], 0], paint: {
        "fill-extrusion-color": "#ff5a3c",
        "fill-extrusion-opacity": 0.86,
        "fill-extrusion-vertical-gradient": true,
        "fill-extrusion-height": ["interpolate", ["linear"], ["zoom"], 5, ["*", scale, 90000], 7, ["*", scale, 42000], 9, ["*", scale, 18000], 11, ["*", scale, 9000]]
      }},
      { id: "hot", type: "line", source: "prov", filter: [">", ["get", "rank"], 0], paint: { "line-color": "#ffe14d", "line-width": 3, "line-opacity": 0.95, "line-blur": 0.4 } }
    ]
  }
});
const marks = PINS.map((pin) => {
  const node = document.createElement("div");
  node.className = "prov-tag";
  node.innerHTML = "<b>" + pin.rank + "</b><span>" + pin.th + "</span>";
  new maplibregl.Marker({ element: node, anchor: "bottom", pitchAlignment: "viewport", rotationAlignment: "viewport" }).setLngLat(pin.c).addTo(map);
  return { rank: pin.rank, node };
});
function paint(rank) {
  if (rank === focus) return;
  focus = rank;
  map.setPaintProperty("rise", "fill-extrusion-color", rank === 0
    ? ["interpolate", ["linear"], ["/", ["get", "gpp"], BKK], 0.05, "#ff5a3c", 1, "#ffe14d"]
    : ["case", ["==", ["get", "rank"], rank], "#ffe14d", "#7a2430"]);
  map.setFilter("hot", rank === 0 ? [">", ["get", "rank"], 0] : ["==", ["get", "rank"], rank]);
}
function show(frame) {
  el.kicker.textContent = frame.k;
  el.kicker.style.display = frame.k ? "" : "none";
  el.title.textContent = frame.l;
  el.title.className = frame.big ? "reel-title is-big" : "reel-title";
  el.sub.textContent = frame.sub;
  el.label.style.opacity = labelsOn && (frame.k || frame.l) ? "1" : "0";
  const chartOn = labelsOn && frame.focus === 0 && frame.t >= 6 && frame.t < 84;
  el.chart.classList.toggle("is-on", chartOn);
  bars.forEach((bar, i) => { bar.style.width = chartOn ? ((GPP[i + 1] / BKK) * 72) + "%" : "0%"; });
  el.src.classList.toggle("is-on", frame.t >= 84);
}
function apply(t) {
  const cam = camAt(t);
  map.jumpTo(cam);
  paint(cam.frame.focus);
  const pulse = 0.5 + 0.5 * Math.sin((t * Math.PI * 2) / 1.7);
  map.setPaintProperty("hot", "line-width", cam.frame.focus === 0 ? 1.6 + pulse * 1.4 : 3 + pulse * 3);
  map.setPaintProperty("hot", "line-opacity", 0.55 + pulse * 0.4);
  for (const mark of marks) mark.node.style.opacity = labelsOn && mark.rank === cam.frame.focus ? "1" : "0";
  el.bar.style.width = (t / DURATION) * 100 + "%";
  show(cam.frame);
}
function tick(now) {
  if (!paused) {
    clock.elapsed = (now - clock.t0) / 1000;
    if (clock.elapsed > DURATION) { clock.elapsed = 0; clock.t0 = now; }
    apply(clock.elapsed);
  } else {
    clock.t0 = now - clock.elapsed * 1000;
  }
  requestAnimationFrame(tick);
}
map.on("load", () => {
  el.status.remove();
  map.resize();
  clock.t0 = performance.now() - clock.elapsed * 1000;
  apply(clock.elapsed);
  requestAnimationFrame(tick);
});
document.getElementById("menuBtn").onclick = () => el.menu.classList.toggle("is-open");
el.play.onclick = () => {
  paused = !paused;
  el.play.textContent = paused ? "เล่น" : "หยุด";
  el.play.classList.toggle("is-on", !paused);
};
document.getElementById("restartBtn").onclick = () => {
  clock.elapsed = 0;
  clock.t0 = performance.now();
  paused = false;
  el.play.textContent = "หยุด";
  el.play.classList.add("is-on");
};
document.getElementById("labelBtn").onclick = () => {
  labelsOn = !labelsOn;
  document.getElementById("labelBtn").classList.toggle("is-on", labelsOn);
};
document.getElementById("recBtn").onclick = () => {
  document.body.classList.add("is-rec");
  clock.elapsed = 0;
  clock.t0 = performance.now();
  paused = false;
};
if (paused) { el.play.textContent = "เล่น"; el.play.classList.remove("is-on"); }
window.addEventListener("resize", () => map.resize());
</script>
</body>
</html>
